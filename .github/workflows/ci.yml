name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js-tests:
    name: JS unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run JS tests
        run: node --test tests/js/*.test.js

  validate:
    name: Validate package metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check metadata.json
        run: |
          python3 - <<'PY'
          import json, sys
          meta = json.load(open("metadata.json"))
          plugin = meta["KPlugin"]
          assert meta["KPackageStructure"] == "Plasma/Applet"
          for key in ("Id", "Name", "Version", "License"):
              assert plugin.get(key), f"missing KPlugin.{key}"
          assert plugin["X-Plasma-API-Minimum-Version"] == "6.0"
          PY
      - name: Check kcfg XML
        run: python3 -c "import xml.dom.minidom as m; m.parse('contents/config/main.xml')"

  package:
    name: Build .plasmoid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: ./scripts/make-plasmoid.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hahub-plasmoid
          path: dist/*.plasmoid
