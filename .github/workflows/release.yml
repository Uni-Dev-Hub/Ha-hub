name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish .plasmoid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches metadata version
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('metadata.json'))['KPlugin']['Version'])")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag v$TAG does not match metadata.json version $VERSION" >&2
            exit 1
          fi
      - name: Package
        run: ./scripts/make-plasmoid.sh
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.plasmoid \
            --title "HA-Hub $GITHUB_REF_NAME" \
            --generate-notes
